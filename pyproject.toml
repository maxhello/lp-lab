[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lp-lab"
version = "0.1.0"
description = "LP Lab — small optimization tools powered by Google OR-Tools. Currently: CP-SAT shift scheduling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ortools>=9.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "app.scheduling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
